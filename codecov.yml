# Codecov configuration. Coverage is uploaded from two jobs under separate
# flags (`python` from tests.yml, `ui` from ui_checks.yml) and merged into a
# single PR comment reporting project (total) + patch (delta) coverage.

coverage:
  status:
    # Project (total) coverage stays report-only so PRs aren't blocked by base-branch
    # drift; the enforced per-PR gate is on patch (new-code) coverage below.
    project:
      default:
        informational: true
    # Patch = coverage of the lines changed in the PR. This is the enforced
    # "coverage on new code" gate that replaces SonarCloud's coverage quality gate.
    # target: auto -> new code must be covered at least as well as the project average.
    patch:
      default:
        target: auto
        informational: false

flag_management:
  default_rules:
    # A PR that only touches one language still shows the other's coverage
    # (carried forward from the base commit) instead of dropping to unknown.
    carryforward: true
  individual_flags:
    - name: python
      paths:
        - ord_app/
    - name: ui
      paths:
        - ui/

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: false
