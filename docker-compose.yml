services:
  api:
    image: ord-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      PG_DSN: "postgresql+psycopg://ord@db:5432/ord"
    volumes:
      - .:/app
      - /app/.venv

  db:
    image: bitnami/postgresql:17
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      POSTGRESQL_DATABASE: ord
      POSTGRESQL_USERNAME: ord
    volumes:
      - db:/bitnami/postgresql
    ports:
      - "5400:5432"

  migrate:
    image: ord-api
    depends_on:
      - db
    environment:
      PG_DSN: "postgresql+psycopg://ord@db:5432/ord"
    volumes:
      - .:/app
    entrypoint: >
      sh -c "alembic upgrade head"

volumes:
  db: