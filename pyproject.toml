[project]
name = "ord-app"
version = "0.1.0"
description = "App for the Open Reaction Database"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orjson>=3.10.12,<4",
    "loguru>=0.7.3,<0.8",
    "freezegun>=1.5.1,<2",
    "asyncpg>=0.30.0,<0.31",
    "fastapi>=0.115.8,<0.116",
    "gunicorn>=23.0.0,<24",
    "ord-schema>=0.3.96,<0.4",
    "protobuf>=4.22,<5",
    "rdkit>=2024.9.5,<2025",
    "uvicorn>=0.34.0,<0.35",
    "python-multipart>=0.0.20,<0.0.21",
    "alembic>=1.14.1,<2",
    "sqlalchemy>=2.0.38,<3",
    "pydantic-settings>=2.7.1,<3",
    "fastapi-pagination>=0.12.34,<0.13",
    "pydantic[email]>=2.10.6,<3",
    "greenlet>=3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9",
    "faker>=36.1.1,<37",
    "sqlalchemy-utils>=0.41.2,<0.42",
    "coverage>=7.6.12,<8",
    "httpx>=0.28.1,<0.29",
    "pytest-cov>=6.0.0,<7",
    "pytype>=2024.10.11",
    "pytest-asyncio>=0.25.3,<0.26",
    "psycopg>=3.2.5,<4",
    "ruff>=0.9.9,<0.10",
]

[tool.uv]
package = false

[tool.black]
line-length = 120

[tool.isort]
skip_glob = ["**/*_pb2.py*"]
line_length = 120
profile = "black"
known_third_party = ["ord_schema"]

[tool.pytype]
inputs = ["ord_app"]
exclude = ["**/*_test.py", "**/test_*.py", "build/", "dist/"]
keep_going = true
disable = ["module-attr", "pyi-error"]
jobs = 0
