[tool.poetry]
name = "ord-app"
version = "0.1.0"
description = "App for the Open Reaction Database"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.12"
fastapi = { extras = ["standard"], version = "==0.115.5" }
gunicorn = "==23.0.0"
jinja2 = "==3.1.4"
numpy = "==2.1.3"
ord-schema = "==0.3.91"
pandas = "==2.2.3"
protobuf = "==4.22.3"
psycopg = { extras = ["binary", "pool"], version = ">=3" }
rdkit = "2024.3.6"
uvicorn = { extras = ["standard"], version = "^0.22.0" }
setuptools = "^75.6.0"
python-multipart = "^0.0.19"
alembic = "^1.14.0"
sqlalchemy = "^2.0.36"
pydantic-settings = "^2.6.1"
greenlet = "^3.1.1"

[tool.poetry.group.dev.dependencies]
black = "*"
coverage = "*"
httpx = "*"
pylint = "*"
pytest = "*"
pytest-cov = "*"
pytype = "*"
tenacity = "*"
testing-postgresql = "*"

[tool.black]
line-length = 120

[tool.isort]
skip_glob = ["**/*_pb2.py*"]
line_length = 120
profile = "black"
known_third_party = ["ord_schema"]

[tool.pytype]
inputs = ["ord_app"]
exclude = ["**/*_test.py", "**/test_*.py", "build/", "dist/"]
keep_going = true
disable = ["module-attr", "pyi-error"]
jobs = 0

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"