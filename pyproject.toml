[tool.poetry]
name = "ord-app"
version = "0.1.0"
description = "App for the Open Reaction Database"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~=3.12"
orjson = "~=3.10"
loguru = "~=0.7"
freezegun = "^1.5.1"
asyncpg = "~=0.30"
fastapi = "~=0.115"
gunicorn = "~=23.0"
ord-schema = "^0.3.96"
protobuf = "^4.22"
rdkit = ">=2024.9.5"
uvicorn = "~=0.34"
python-multipart = "~=0.0"
alembic = "~=1.14"
sqlalchemy = "~=2.0"
pydantic-settings = "~=2.7"
fastapi-pagination = "~=0.12"
pydantic = {extras = ["email"], version = "~=2.10"}

[tool.poetry.group.dev.dependencies]
pytest = "~=8.3"
faker = "~=36.1"
sqlalchemy-utils = "~=0.41"
coverage = "~=7.6"
httpx = "~=0.28"
pytest-cov = "~=6.0"
pytype = "~=2024.10"
pytest-asyncio = "~=0.25"
psycopg = "~=3.2"
ruff = "~=0.9"

[tool.black]
line-length = 120

[tool.isort]
skip_glob = ["**/*_pb2.py*"]
line_length = 120
profile = "black"
known_third_party = ["ord_schema"]

[tool.pytype]
inputs = ["ord_app"]
exclude = ["**/*_test.py", "**/test_*.py", "build/", "dist/"]
keep_going = true
disable = ["module-attr", "pyi-error"]
jobs = 0

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
