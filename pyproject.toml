[project]
name = "ord-app"
version = "0.1.0"
description = "App for the Open Reaction Database"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orjson>=3.10.12,<4",
    "loguru>=0.7.3,<0.8",
    "freezegun>=1.5.1,<2",
    "asyncpg>=0.30.0,<0.31",
    "fastapi>=0.138.0,<0.200",
    "gunicorn>=23.0.0,<24",
    "ord-schema>=0.6.31,<0.7",
    "protobuf>=5.29.6,<6",
    "rdkit>=2024.9.5,<2025",
    "uvicorn>=0.34.0,<0.35",
    "python-multipart>=0.0.31,<0.1",
    "alembic>=1.14.1,<2",
    "sqlalchemy>=2.0.38,<3",
    "pydantic-settings>=2.7.1,<3",
    "fastapi-pagination>=0.14.0,<0.16",
    "pydantic[email]>=2.10.6,<3",
    "greenlet>=3",
    "httpx>=0.28.1,<0.29",
    "psycopg>=3.2.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "faker>=36.1.1,<37",
    "sqlalchemy-utils>=0.41.2,<0.42",
    "coverage>=7.6.12,<8",
    "pytest-cov>=6.0.0,<7",
    "ty>=0.0.28",
    "pytest-asyncio>=1.0,<2",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9.9,<0.10",
    "pre-commit>=4.0,<5",
]

[tool.uv]
package = false

# Pytest config lives here (single source of truth); the former root tox.ini
# (which only held a [pytest] section, no tox config) has been folded in.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Total-coverage floor enforced in CI (a regression backstop). pytest-cov honors this on
# every `pytest --cov` run. Set a few points below current (~83% total, which includes the
# test modules) so routine churn doesn't trip it; ratchet up over time.
[tool.coverage.report]
fail_under = 80

# Ruff config lives here (single source of truth); the former root ruff.toml
# took precedence over [tool.ruff] and has been folded in.
[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4
# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors+warnings (E/W), pyflakes (F), import sorting (I), bugbear (B),
# pyupgrade (UP), flake8-simplify (SIM), full type annotations (ANN: arguments,
# *args/**kwargs, return types, and no bare Any), flake8-fastapi (FAST), and
# flake8-bandit (S: security/SAST -- replaces SonarCloud's Python security findings).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN", "FAST", "S"]
# E501 (line length) is the formatter's job; SIM108 (ternaries aren't always
# clearer); B008 (function calls in argument defaults are fine here, e.g. FastAPI Depends).
# ANN401 (no bare `Any`): off because `Any` is the honest type for **kwargs forwarded to
# HTTPException/SQLAlchemy filters and for pydantic "before" validators that receive raw
# input -- annotating those as `object` breaks type checking, so the rule only adds noqas.
ignore = ["E501", "SIM108", "B008", "ANN401"]
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests trip a couple of flake8-bugbear (the "B" rules) checks -- B011 (`assert False`)
# and B017 (overly broad `pytest.raises(Exception)`); type annotations (ANN) also add
# little value on test functions. S101 (flake8-bandit) flags `assert`, which is exactly
# how pytest expresses checks, so it is pure noise in tests. Skip all of these in tests.
"ord_app/tests/**" = ["B011", "B017", "ANN", "S101"]

[tool.ruff.lint.isort]
# ord_schema is an external dependency; pin its classification so import
# ordering is deterministic even when the environment is not fully resolved.
known-third-party = ["ord_schema"]

[tool.ruff.format]
# Like Black: double quotes, space indent, respect magic trailing commas.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ty (Astral's type checker) is invoked as `ty check ord_app` by CI and the pre-commit
# hook, so no input globs are configured here; ord_app ships no generated sources, so no
# excludes are needed. ty type-checks the test suite too, which is intentional.
