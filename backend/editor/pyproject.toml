[project]
name = "ord-editor"
version = "0.1.0"
description = "The Open Reaction Database editor's backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orjson>=3.10.12,<4",
    "loguru>=0.7.3,<0.8",
    "freezegun>=1.5.1,<2",
    "fastapi>=0.138.0,<0.200",
    "gunicorn>=23.0.0,<24",
    "ord-schema>=0.9.6,<0.10",
    "protobuf>=5.29.6,<6",
    # RDKit publishes Intel macOS wheels through 2025.9.3 and no source archive, so a
    # later release cannot install there; ord-schema needs 2025.3.4 or later.
    "rdkit>=2025.3.4,<2025.9.4",
    "uvicorn>=0.34.0,<0.35",
    "python-multipart>=0.0.31,<0.1",
    "alembic>=1.14.1,<2",
    "sqlalchemy>=2.0.38,<3",
    "pydantic-settings>=2.7.1,<3",
    "fastapi-pagination>=0.14.0,<0.16",
    "pydantic[email]>=2.10.6,<3",
    "greenlet>=3",
    "httpx>=0.28.1,<0.29",
    "psycopg[binary]>=3.2.5,<4",
    "pyarrow>=24,<25",
    "pyjwt[crypto]>=2.15.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "faker>=36.1.1,<37",
    "sqlalchemy-utils>=0.41.2,<0.42",
    "coverage>=7.6.12,<8",
    "pytest-cov>=6.0.0,<7",
    "ty>=0.0.28",
    "pytest-asyncio>=1.0,<2",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9.9,<0.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Tests are colocated next to the code they exercise (e.g. resources/v1/datasets.py +
# resources/v1/datasets_test.py), so collect the `*_test.py` suffix and scope discovery to the
# package. Shared fixtures/helpers live in ord_editor/conftest.py.
testpaths = ["ord_editor"]
python_files = ["*_test.py"]

# Total-coverage floor enforced in CI (a regression backstop). pytest-cov honors this on
# every `pytest --cov` run. Set a few points below current (~83% total, which includes the
# test modules) so routine churn doesn't trip it; ratchet up over time.
[tool.coverage.report]
fail_under = 80

# ty is invoked as `ty check ord_editor` by CI and the pre-commit hook, so no input
# globs are configured here; ord_editor ships no generated sources, so no excludes are
# needed. ty type-checks the test suite too, which is intentional.
