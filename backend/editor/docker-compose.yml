# The editor's development stack: Postgres, the API, and a migration job. Run it from
# this directory: docker compose up -d. The project keeps the name it had at the
# repository's root, and with it the name of the pgdata volume.
name: ord-app

services:
  api:
    image: ord-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      PG_DSN: "postgresql+psycopg://ord@db:5432/ord"
      PG_TEST_DSN: "postgresql+psycopg://ord@db:5432/test"
      APP_ENV: "localhost"
    volumes:
      - .:/app
      - /app/.venv
    networks:
      - ord_network

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ord
      POSTGRES_USER: ord
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5400:5432"
    networks:
      - ord_network
    healthcheck:
      # Over TCP: the image's first-run init server listens only on the socket.
      test: pg_isready -h localhost -U ord
      interval: 5s
      retries: 6
      start_period: 1s

  migrate:
    image: ord-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_DSN: "postgresql+psycopg://ord@db:5432/ord"
      PG_ALEMBIC_DSN: "postgresql+psycopg://ord@db:5432/ord"
    volumes:
      - .:/app
    entrypoint: >
      sh -c "alembic upgrade head"
    networks:
      - ord_network
    restart: "no"

networks:
  ord_network:
    name: ord_network

volumes:
  pgdata: