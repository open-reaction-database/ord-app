[project]
name = "ord-viewer"
version = "0.1.0"
description = "The Open Reaction Database viewer's backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13,<2",
    "anyio>=4.15,<5",
    "fastapi>=0.138.0,<0.200",
    # Corpus opens only artifacts stamped with its own RDKit version and artifact
    # lineage, so RDKit follows the corpus ord-schema publishes and ord-schema stays on
    # a release whose artifact definitions match it.
    "ord-schema[huggingface,nl,search]==0.9.3",
    "rdkit==2026.3.5",
    "pyarrow>=24,<25",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "uvicorn>=0.34.0,<0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    # What the Anthropic SDK's errors take; the ask tests build them.
    "httpx2>=2.13,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0.0,<7",
    "pytest-xdist>=3.6,<4",
    # The version the ruff pre-commit hook pins.
    "ruff==0.9.10",
    "ty>=0.0.51",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Tests sit beside the code as <module>_test.py; fixtures are in ord_viewer/conftest.py.
testpaths = ["ord_viewer"]
python_files = ["*_test.py"]

[tool.coverage.report]
# A few points below the measured total, as a regression backstop; ratchet up over time.
fail_under = 90
