name: Checks

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:
  check_license_headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.16'
      - name: Install dependencies
        run: go install github.com/google/addlicense@latest
      - name: addlicense
        run: addlicense -check -c "Open Reaction Database Project Authors" -l apache .

  check_python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff
        run: uv run ruff check ord_app/

      - name: ruff format
        run: uv run ruff format --check ord_app/

      - name: pytype
        run: uv run pytype -j auto

  check_javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: clang-format
        run: |
          sudo apt update && sudo apt install clang-format --yes
          # NOTE(kearnes): Run clang-format before installing anything with npm.
          find . -name '*.js' -exec clang-format -n -Werror {} +
