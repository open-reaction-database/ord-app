name: Checks

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:
  check_license_headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.16'
          # The repository has no go.sum to key a module cache on.
          cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      # The pre-commit hook pins addlicense's version and arguments for CI and local commits alike.
      - name: addlicense
        run: uvx --no-build --from 'pre-commit==4.6.0' pre-commit run addlicense --all-files --show-diff-on-failure

  check_python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend/editor
        run: uv sync --frozen --no-build

      - name: ruff
        working-directory: backend/editor
        run: uv run --frozen --no-build ruff check ord_editor/

      - name: ruff format
        working-directory: backend/editor
        run: uv run --frozen --no-build ruff format --check ord_editor/

      - name: ty
        working-directory: backend/editor
        run: uv run --frozen --no-build ty check ord_editor

  # Cross-language copy-paste detection (replaces SonarCloud's duplication metric).
  # jscpd is pinned as a frontend/ devDependency; run from the repo root so it scans
  # backend/editor/ord_editor (Python) and the frontend workspaces' src/ trees (TS/TSX)
  # per .jscpd.json.
  # Runs on every PR (not path-filtered) so Python-only changes are covered too.
  check_duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install jscpd (via frontend devDependencies)
        run: npm --prefix frontend ci --ignore-scripts
      - name: jscpd
        run: frontend/node_modules/.bin/jscpd --config .jscpd.json
