name: Checks

on:
  # Every pull request runs these jobs, whatever it changes: the main branch's ruleset
  # requires them, and a required check that never reports leaves the PR blocked.
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:
  check_license_headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.16'
          # The repository has no go.sum to key a module cache on.
          cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      # The pre-commit hook pins addlicense's version and arguments for CI and local commits alike.
      - name: addlicense
        run: uvx --no-build --from 'pre-commit==4.6.0' pre-commit run addlicense --all-files --show-diff-on-failure

  check_python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend/editor
        run: uv sync --frozen --no-build

      - name: ruff
        working-directory: backend/editor
        run: uv run --frozen --no-build ruff check ord_editor/

      - name: ruff format
        working-directory: backend/editor
        run: uv run --frozen --no-build ruff format --check ord_editor/

      - name: ty
        working-directory: backend/editor
        run: uv run --frozen --no-build ty check ord_editor

      - name: Install dependencies (viewer)
        working-directory: backend/viewer
        run: uv sync --frozen --no-build

      - name: ruff (viewer)
        working-directory: backend/viewer
        run: uv run --frozen --no-build ruff check ord_viewer/

      - name: ruff format (viewer)
        working-directory: backend/viewer
        run: uv run --frozen --no-build ruff format --check ord_viewer/

      - name: ty (viewer)
        working-directory: backend/viewer
        run: uv run --frozen --no-build ty check ord_viewer

  # Cross-language copy-paste detection (replaces SonarCloud's duplication metric).
  # jscpd is pinned as a frontend/ devDependency; run from the repo root so it scans
  # backend/editor/ord_editor and backend/viewer/ord_viewer (Python) and the frontend
  # workspaces' src/ trees (TS/TSX) per .jscpd.json.
  # Runs on every PR (not path-filtered) so Python-only changes are covered too.
  check_ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run lint:check
      - run: npm run typecheck
      # The viewer's API types are generated from backend/viewer/openapi.json, which
      # test_python_viewer pins to the backend's routes.
      - name: The viewer's API types match the backend's document
        run: |
          npm run generate:api -w apps/viewer
          git diff --exit-code -- apps/viewer/src/api/schema.ts
      # deploy/editor/Dockerfile builds with ORD_APP_REQUIRE_AUTH0, which fails the build
      # when an Auth0 setting is missing (vite.config.ts). The check runs as the config
      # loads, so this step is fast; the build below passes it with placeholder values.
      - name: Image builds fail without the Auth0 settings
        run: |
          (cd apps/editor && ORD_APP_REQUIRE_AUTH0=true ../../node_modules/.bin/vite build) > "$RUNNER_TEMP/auth0.log" 2>&1 || true
          grep 'Missing VITE_AUTH0_DOMAIN' "$RUNNER_TEMP/auth0.log"
      - run: npm run build
        env:
          ORD_APP_REQUIRE_AUTH0: 'true'
          VITE_AUTH0_DOMAIN: auth0.example.com
          VITE_AUTH0_CLIENT_ID: placeholder
          VITE_AUTH0_AUDIENCE: https://auth0.example.com/api/v2/
          VITE_AUTH0_ISSUER: https://auth0.example.com/
          VITE_AUTH0_SCOPE: openid

  check_duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install jscpd (via frontend devDependencies)
        run: npm --prefix frontend ci --ignore-scripts
      - name: jscpd
        run: frontend/node_modules/.bin/jscpd --config .jscpd.json
