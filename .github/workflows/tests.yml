name: Tests

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:

  test_python:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: ikalnytskyi/action-setup-postgres@v7
        id: postgres
        with:
          username: ord
          password: password
          database: test
          port: 5432
          postgres-version: "17"
          ssl: true

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run alembic migrations
        run: uv run alembic upgrade head
        env:
          PG_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Run tests
        run: uv run pytest -vv --cov=ord_app --durations=10
        env:
          PG_DSN: "postgresql+asyncpg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
