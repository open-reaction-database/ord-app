name: Tests

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:

  test_python_editor:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend/editor

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        id: postgres
        with:
          username: ord
          password: password
          database: test
          port: 5432
          postgres-version: "17"
          ssl: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run alembic migrations
        run: uv run --frozen --no-build alembic upgrade head
        env:
          PG_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Run tests
        run: uv run --frozen --no-build pytest -vv --cov=ord_editor --cov-report=term-missing --cov-report=html --durations=10
        env:
          PG_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Coverage summary
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: |
          {
            echo "### Python test coverage"
            echo ""
            uv run --frozen --no-build coverage report --format=markdown || echo "_coverage data unavailable_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python coverage report
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: backend/editor/htmlcov/
          retention-days: 7

  test_python_viewer:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend/viewer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run tests
        run: uv run --frozen --no-build pytest -n auto -vv --cov=ord_viewer --cov-report=term-missing --cov-report=html --durations=10

      - name: Coverage summary
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: |
          {
            echo "### Python viewer test coverage"
            echo ""
            uv run --frozen --no-build coverage report --format=markdown || echo "_coverage data unavailable_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python viewer coverage report
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-viewer-coverage
          path: backend/viewer/htmlcov/
          retention-days: 7

  test_ui_editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage -w apps/editor

      - name: Coverage summary
        if: always()
        run: |
          summary="apps/editor/coverage/coverage-summary.json"
          [ -f "$summary" ] || exit 0
          {
            echo "### UI test coverage: apps/editor"
            echo ""
            jq -r '.total | "| Metric | % | Covered / Total |\n|---|---:|---:|\n| Lines | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |\n| Statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |\n| Functions | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |\n| Branches | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the editor's coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-editor-coverage
          path: frontend/apps/editor/coverage/
          retention-days: 7

  test_ui_shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage -w packages/ui

      - name: Coverage summary
        if: always()
        run: |
          summary="packages/ui/coverage/coverage-summary.json"
          [ -f "$summary" ] || exit 0
          {
            echo "### UI test coverage: packages/ui"
            echo ""
            jq -r '.total | "| Metric | % | Covered / Total |\n|---|---:|---:|\n| Lines | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |\n| Statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |\n| Functions | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |\n| Branches | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shared package's coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-shared-coverage
          path: frontend/packages/ui/coverage/
          retention-days: 7

  test_ui_viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage -w apps/viewer

      - name: Coverage summary
        if: always()
        run: |
          summary="apps/viewer/coverage/coverage-summary.json"
          [ -f "$summary" ] || exit 0
          {
            echo "### UI test coverage: apps/viewer"
            echo ""
            jq -r '.total | "| Metric | % | Covered / Total |\n|---|---:|---:|\n| Lines | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |\n| Statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |\n| Functions | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |\n| Branches | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the viewer's coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-viewer-coverage
          path: frontend/apps/viewer/coverage/
          retention-days: 7

  test_e2e_editor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: ord
          password: password
          database: test
          port: 5432
          postgres-version: "17"
          ssl: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: backend/editor
        run: uv sync --frozen --no-build

      - name: Run alembic migrations
        working-directory: backend/editor
        run: uv run --frozen --no-build alembic upgrade head
        env:
          PG_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: frontend
        run: node_modules/.bin/playwright install --with-deps chromium

      # The UI is served via the dev server (vite dev), not a production build: the no-auth
      # bypass is hard-gated off in production builds (import.meta.env.PROD), so e2e must use
      # dev mode. Backend + UI + Playwright all run in one step because background processes
      # started in earlier steps do not survive into later ones on GitHub runners.
      - name: Start servers and run E2E
        run: |
          set -e
          nohup uv run --directory backend/editor --frozen --no-build uvicorn ord_editor.service_api.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          nohup npm --prefix frontend -w apps/editor run dev -- --host 127.0.0.1 --port 5173 > /tmp/ui.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/service_api/docs > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/service_api/docs > /dev/null || { echo "backend failed"; cat /tmp/backend.log; exit 1; }
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173 > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:5173 > /dev/null || { echo "ui failed"; cat /tmp/ui.log; exit 1; }
          npm --prefix frontend -w apps/editor run test:e2e
        env:
          APP_ENV: localhost
          ORD_APP_E2E: "true"
          CORS_ORIGINS: '["http://127.0.0.1:5173"]'
          VITE_E2E_NO_AUTH: "TRUE"
          VITE_API_ENDPOINT: "http://127.0.0.1:8000/service_api/api/v1"
          PG_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Server logs (on failure)
        if: failure()
        run: cat /tmp/backend.log /tmp/ui.log || true

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/apps/editor/playwright-report/
            frontend/apps/editor/test-results/
            frontend/apps/editor/e2e/*-snapshots/
          retention-days: 7

  test_e2e_viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install the backend
        working-directory: backend/viewer
        run: uv sync --frozen --no-build

      - name: Derive the test corpus
        working-directory: backend/viewer
        run: uv run --frozen --no-build python -m ord_viewer.testing "$RUNNER_TEMP/corpus"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright's browser
        working-directory: frontend
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Build the viewer
        working-directory: frontend
        run: npm run build -w apps/viewer

      # Background processes do not outlive their step on GitHub's runners, so the
      # servers and the tests share one.
      - name: Serve the viewer and run its end-to-end tests
        env:
          ORD_VIEWER_CORPUS_DIR: ${{ runner.temp }}/corpus
        run: |
          nohup uv run --directory backend/viewer --frozen --no-build \
            uvicorn --factory ord_viewer.testing:e2e_app --host 127.0.0.1 --port 8001 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          nohup npm --prefix frontend -w apps/viewer run preview -- --host 127.0.0.1 \
            > "$RUNNER_TEMP/preview.log" 2>&1 &
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf --max-time 5 "$1" > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "$1 did not answer:"
            cat "$2"
            return 1
          }
          wait_for http://127.0.0.1:8001/api/health "$RUNNER_TEMP/backend.log"
          wait_for http://127.0.0.1:4174/ "$RUNNER_TEMP/preview.log"
          npm --prefix frontend -w apps/viewer run test:e2e

      - name: Server logs (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/preview.log" || true

      - name: Upload the Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-viewer
          path: |
            frontend/apps/viewer/playwright-report/
            frontend/apps/viewer/test-results/
            frontend/apps/viewer/e2e/*-snapshots/
          retention-days: 7
