name: Tests

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:

  test_python:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ikalnytskyi/action-setup-postgres@10ab8a56cc77b4823c2bfa57b1d4dd5605ef0481 # v7
        id: postgres
        with:
          username: ord
          password: password
          database: test
          port: 5432
          postgres-version: "17"
          ssl: true

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run alembic migrations
        run: uv run alembic upgrade head
        env:
          PG_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Run tests
        run: uv run pytest -vv --cov=ord_app --cov-report=term-missing --cov-report=xml --cov-report=html --durations=10
        env:
          PG_DSN: "postgresql+asyncpg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Coverage summary
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        run: |
          {
            echo "### Python test coverage"
            echo ""
            uv run coverage report --format=markdown || echo "_coverage data unavailable_"
          } >> "$GITHUB_STEP_SUMMARY"

      # Codecov posts the PR comment with project (total) + patch (delta) coverage,
      # merging this upload with the UI lcov via the `python`/`ui` flags.
      - name: Upload coverage to Codecov
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: coverage.xml
          flags: python
          # CODECOV_TOKEN is an org-wide token, so the repo slug must be explicit.
          slug: open-reaction-database/ord-app
          token: ${{ secrets.CODECOV_TOKEN }}
          # Best-effort: don't fail CI on Codecov uploader flakes (e.g. transient GPG
          # signature-verification / keyserver outages). The Codecov status check and the
          # SonarCloud gate still surface coverage regressions.
          fail_ci_if_error: false

      - name: Upload Python coverage report
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  test_e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ikalnytskyi/action-setup-postgres@10ab8a56cc77b4823c2bfa57b1d4dd5605ef0481 # v7
        with:
          username: ord
          password: password
          database: test
          port: 5432
          postgres-version: "17"
          ssl: true

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run alembic migrations
        run: uv run alembic upgrade head
        env:
          PG_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # The UI is served via the dev server (vite dev), not a production build: the no-auth
      # bypass is hard-gated off in production builds (import.meta.env.PROD), so e2e must use
      # dev mode. Backend + UI + Playwright all run in one step because background processes
      # started in earlier steps do not survive into later ones on GitHub runners.
      - name: Start servers and run E2E
        run: |
          set -e
          nohup uv run uvicorn ord_app.service_api.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          nohup npm --prefix ui run dev -- --host 127.0.0.1 --port 5173 > /tmp/ui.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/service_api/docs > /dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8000/service_api/docs > /dev/null || { echo "backend failed"; cat /tmp/backend.log; exit 1; }
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173 > /dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:5173 > /dev/null || { echo "ui failed"; cat /tmp/ui.log; exit 1; }
          npm --prefix ui run test:e2e
        env:
          APP_ENV: localhost
          ORD_APP_E2E: "true"
          CORS_ORIGINS: '["http://127.0.0.1:5173"]'
          VITE_E2E_NO_AUTH: "TRUE"
          VITE_API_ENDPOINT: "http://127.0.0.1:8000/service_api/api/v1"
          PG_DSN: "postgresql+asyncpg://ord:password@localhost:5432/test"
          PG_ALEMBIC_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"
          PG_TEST_DSN: "postgresql+psycopg://ord:password@localhost:5432/test"

      - name: Server logs (on failure)
        if: failure()
        run: cat /tmp/backend.log /tmp/ui.log || true

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7
