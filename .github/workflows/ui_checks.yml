name: UI checks

on:
  # Every pull request runs these jobs, whatever it changes: the main branch's ruleset
  # requires them, and a required check that never reports leaves the PR blocked.
  pull_request:
    branches:
      - '*'
  push:
    paths:
      - 'frontend/**'
    branches:
      - 'main'

defaults:
  run:
    working-directory: ./frontend

jobs:
  check_ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run lint:check
      - run: npm run typecheck
      # The viewer's API types are generated from backend/viewer/openapi.json, which
      # test_python_viewer pins to the backend's routes.
      - name: The viewer's API types match the backend's document
        run: |
          npm run generate:api -w apps/viewer
          git diff --exit-code -- apps/viewer/src/api/schema.ts
      # deploy/editor/Dockerfile builds with ORD_APP_REQUIRE_AUTH0, which fails the build
      # when an Auth0 setting is missing (vite.config.ts). The check runs as the config
      # loads, so this step is fast; the build below passes it with placeholder values.
      - name: Image builds fail without the Auth0 settings
        run: |
          (cd apps/editor && ORD_APP_REQUIRE_AUTH0=true ../../node_modules/.bin/vite build) > "$RUNNER_TEMP/auth0.log" 2>&1 || true
          grep 'Missing VITE_AUTH0_DOMAIN' "$RUNNER_TEMP/auth0.log"
      - run: npm run build
        env:
          ORD_APP_REQUIRE_AUTH0: 'true'
          VITE_AUTH0_DOMAIN: auth0.example.com
          VITE_AUTH0_CLIENT_ID: placeholder
          VITE_AUTH0_AUDIENCE: https://auth0.example.com/api/v2/
          VITE_AUTH0_ISSUER: https://auth0.example.com/
          VITE_AUTH0_SCOPE: openid

  test_ui_editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage -w apps/editor

      - name: Coverage summary
        if: always()
        run: |
          summary="apps/editor/coverage/coverage-summary.json"
          [ -f "$summary" ] || exit 0
          {
            echo "### UI test coverage: apps/editor"
            echo ""
            jq -r '.total | "| Metric | % | Covered / Total |\n|---|---:|---:|\n| Lines | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |\n| Statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |\n| Functions | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |\n| Branches | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the editor's coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-editor-coverage
          path: frontend/apps/editor/coverage/
          retention-days: 7

  test_ui_shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage -w packages/ui

      - name: Coverage summary
        if: always()
        run: |
          summary="packages/ui/coverage/coverage-summary.json"
          [ -f "$summary" ] || exit 0
          {
            echo "### UI test coverage: packages/ui"
            echo ""
            jq -r '.total | "| Metric | % | Covered / Total |\n|---|---:|---:|\n| Lines | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |\n| Statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |\n| Functions | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |\n| Branches | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shared package's coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-shared-coverage
          path: frontend/packages/ui/coverage/
          retention-days: 7

  test_ui_viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage -w apps/viewer

      - name: Coverage summary
        if: always()
        run: |
          summary="apps/viewer/coverage/coverage-summary.json"
          [ -f "$summary" ] || exit 0
          {
            echo "### UI test coverage: apps/viewer"
            echo ""
            jq -r '.total | "| Metric | % | Covered / Total |\n|---|---:|---:|\n| Lines | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |\n| Statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |\n| Functions | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |\n| Branches | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the viewer's coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-viewer-coverage
          path: frontend/apps/viewer/coverage/
          retention-days: 7
