# nginx runs as appuser, so it keeps its pid in /tmp and logs to the container's output.
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # nginx's combined format, with the query left out of an ask address, as the request
    # or as its Referer. The viewer writes a question and its structures in the fragment,
    # which no browser sends; these cover an /ask?q=… request, redirected below.
    map $request_uri $logged_uri {
        "~^/ask\?"  /ask;
        default     $request_uri;
    }
    map $http_referer $logged_referer {
        ""                        -;
        "~^(?<ask>[^?#]*/ask)\?"  $ask;
        default                   $http_referer;
    }
    log_format viewer '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $logged_uri $server_protocol" $status '
                      '$body_bytes_sent "$logged_referer" "$http_user_agent"';
    access_log /dev/stdout viewer;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    # Behind the load balancer, $remote_addr is the balancer's. These restore the
    # client's from X-Forwarded-For, trusting the hops inside the VPC's private range, so
    # the limit below counts each client rather than each balancer node.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Each ask costs model calls; 10 a minute per client, with a burst of 5.
    limit_req_zone $binary_remote_addr zone=ask:10m rate=10r/m;
    limit_req_status 429;

    # A download of 1,000 IDs is about 40 KiB.
    client_max_body_size 128k;

    # A request line must fit one buffer. The load balancer in front takes a request line
    # of at most 16 KiB, and so does this, so an address it passes is not refused here.
    large_client_header_buffers 4 16k;

    # The SPA's hashed assets never change; index.html, which names them, always might.
    map $uri $cache_control {
        default "";
        ~^/assets/ "public, max-age=31536000, immutable";
        /index.html "no-cache";
    }

    upstream api {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;
        root /var/www/html;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Past the 10 s slot wait, three model calls (the query, its repair, and the
        # answer) of one 30 s attempt each, and the 30 s search.
        location = /api/ask {
            limit_req zone=ask burst=5 nodelay;
            proxy_read_timeout 150s;
            proxy_pass http://api;
        }

        # Ahead of every static rule, so none shadows /api/openapi.json. Past the 10 s slot
        # wait and the 30 s search timeout.
        location ^~ /api/ {
            proxy_read_timeout 60s;
            proxy_pass http://api;
        }

        # An ask address with its question in the query goes to the same address with the
        # query as its fragment, where the viewer reads it, so the page never loads with
        # the question in its address. Relative, so the browser keeps its scheme and host.
        location = /ask {
            absolute_redirect off;
            if ($arg_q) {
                return 302 "/ask#$args";
            }
            try_files $uri /index.html;
        }

        location ~ ^/editor(/|$) {
            return 301 https://app.open-reaction-database.org/;
        }

        location / {
            add_header Cache-Control $cache_control;
            try_files $uri /index.html;
        }
    }
}
